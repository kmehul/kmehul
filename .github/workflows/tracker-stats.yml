name: Refresh tracker stats

# Keeps the Apple Music tracker card's live numbers current: "artists watched" (the
# tracker's artists.txt) and "releases caught" (its caught.json). Hourly, at an odd
# minute because GitHub delays and sometimes drops scheduled runs at the top of the hour.
# Rebuilds and commits only when a number changes, plus a monthly heartbeat so the
# schedule isn't disabled after 60 days without repository activity.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit the rebuilt cards

concurrency:
  group: tracker-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read the tracker's live numbers
        id: stats
        run: python scripts/refresh_tracker_stats.py >> "$GITHUB_OUTPUT"

      - name: Rebuild the cards
        if: steps.stats.outputs.changed == 'true'
        run: |
          pip install fonttools==4.66.1
          python scripts/build_assets.py

      - name: Commit
        if: steps.stats.outputs.changed == 'true' || steps.stats.outputs.heartbeat == 'true'
        run: |
          git config user.name "stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update tracker stats"
          git pull --rebase origin main
          git push
