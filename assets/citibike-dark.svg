<svg xmlns="http://www.w3.org/2000/svg" width="840" height="550" viewBox="0 0 840 550" role="img" aria-label="Featured project: Jersey City Last-Mile Mobility, a CitiBike analysis. 94,689 verified trips, 10 priority stations, 17.8% peak daily imbalance. Members average 8 minute rides, casual riders 15. Busiest station: Grove St PATH."><title>Featured project: Jersey City Last-Mile Mobility, a CitiBike analysis. 94,689 verified trips, 10 priority stations, 17.8% peak daily imbalance. Members average 8 minute rides, casual riders 15. Busiest station: Grove St PATH.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><rect x=".5" y=".5" width="839" height="549" rx="20" fill="#161b22" stroke="#30363d"/><text x="44.0" y="58.0" font-size="12" font-weight="600" fill="#2997ff" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">FEATURED PROJECT</text><text x="796.0" y="58.0" font-size="14" font-weight="500" fill="#8b949e" text-anchor="end" class="a" style="animation-delay:0.05s">Jun – Jul 2026</text><text x="44.0" y="98.0" font-size="30" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.10s" letter-spacing="-0.50">Jersey City Last-Mile Mobility</text><text x="44.0" y="126.0" font-size="17" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.16s">A CitiBike demand and rebalancing analysis</text><text x="44.0" y="170.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.22s">Which stations run out of bikes, and when?</text><text x="44.0" y="192.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.26s">Cleaned 95,350 trips in pandas, modeled</text><text x="44.0" y="214.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.30s">station flow and imbalance in PostgreSQL,</text><text x="44.0" y="236.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.34s">and mapped all 108 stations in Tableau with</text><text x="44.0" y="258.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.38s">two city-separated rebalancing routes.</text><g class="a" style="animation-delay:0.35s"><rect x="44.0" y="278.0" width="100" height="28" rx="14.0" fill="#21262d"/><text x="94.0" y="292.0" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">PostgreSQL</text></g><g class="a" style="animation-delay:0.40s"><rect x="152.0" y="278.0" width="69" height="28" rx="14.0" fill="#21262d"/><text x="186.4" y="292.0" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">pandas</text></g><g class="a" style="animation-delay:0.45s"><rect x="228.8" y="278.0" width="77" height="28" rx="14.0" fill="#21262d"/><text x="267.1" y="292.0" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Tableau</text></g><rect x="466" y="150.0" width="330" height="230.0" rx="16" fill="#21262d" class="a" style="animation-delay:0.30s"/><text x="486.0" y="184.0" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.35s">Average ride length</text><text x="486.0" y="204.0" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.38s">Members commute; casual riders linger.</text><text x="486.0" y="242.0" font-size="13" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.45s">Member</text><rect x="486" y="250.0" width="121" height="22" rx="6" fill="#0090f7" class="gx" style="animation-delay:0.60s"/><text x="614.5" y="267.0" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:1.20s">8 min</text><text x="486.0" y="292.0" font-size="13" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.45s">Casual</text><rect x="486" y="300.0" width="226" height="22" rx="6" fill="#a94ef5" class="gx" style="animation-delay:0.75s"/><text x="720.0" y="317.0" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:1.35s">15 min</text><line x1="486" x2="776" y1="334.0" y2="334.0" stroke="#30363d"/><text x="486.0" y="360.0" font-size="13" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.60s">Busiest station</text><text x="776.0" y="360.0" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="end" class="a" style="animation-delay:0.60s">Grove St PATH</text><text x="44.0" y="426.0" font-size="28" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.50s" letter-spacing="-0.6"><tspan fill="#0090f7">9</tspan><tspan fill="#0c8bf8">4</tspan><tspan fill="#1986f9">,</tspan><tspan fill="#2582fa">6</tspan><tspan fill="#317dfb">8</tspan><tspan fill="#3d78fc">9</tspan></text><text x="44.0" y="447.0" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.50s">verified trips</text><text x="294.7" y="426.0" font-size="28" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.58s" letter-spacing="-0.6"><tspan fill="#3d78fc">1</tspan><tspan fill="#7662fc">0</tspan></text><text x="294.7" y="447.0" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.58s">priority stations</text><text x="545.3" y="426.0" font-size="28" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.66s" letter-spacing="-0.6"><tspan fill="#7662fc">1</tspan><tspan fill="#825dfa">7</tspan><tspan fill="#8f58f8">.</tspan><tspan fill="#9c53f7">8</tspan><tspan fill="#a94ef5">%</tspan></text><text x="545.3" y="447.0" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.66s">peak daily imbalance</text><g class="a" style="animation-delay:0.75s"><rect x="44" y="468.0" width="752" height="56" rx="10" fill="#0f2a4d"/><circle cx="64" cy="487.0" r="8" fill="#2997ff"/><path d="M60 487.2 l2.8 2.8 l5-5.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="491.5" font-size="13" fill="#f0f6fc">Independent AI code review caught a NULL bug and a sign error in 44 of 81 stations, both</text><text x="82" y="509.5" font-size="13" fill="#f0f6fc">fixed before publishing.</text></g></svg>
