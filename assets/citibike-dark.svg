<svg xmlns="http://www.w3.org/2000/svg" width="840" height="452" viewBox="0 0 840 452" role="img" aria-label="Featured project: Jersey City Last-Mile Mobility, a CitiBike analysis. 94,689 verified trips, 10 priority stations, 17.8% peak daily imbalance. Members average 8 minute rides, casual riders 15. Busiest station: Grove St PATH."><title>Featured project: Jersey City Last-Mile Mobility, a CitiBike analysis. 94,689 verified trips, 10 priority stations, 17.8% peak daily imbalance. Members average 8 minute rides, casual riders 15. Busiest station: Grove St PATH.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.a{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
.f{opacity:0;animation:fade .35s ease forwards}
.gy{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:gy .9s cubic-bezier(.2,.8,.2,1) forwards}
.gx{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:gx 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.d{animation:draw 1.4s ease forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes gy{to{transform:scaleY(1)}}
@keyframes gx{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){
 .a,.f,.gy,.gx,.d,.cur,.tg{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
 .tm,.tc{display:none}
}
</style><linearGradient id="ng" gradientUnits="userSpaceOnUse" x1="44" y1="0" x2="420" y2="0"><stop offset="0" stop-color="#0090f7"/><stop offset=".5" stop-color="#5c6cff"/><stop offset="1" stop-color="#a94ef5"/></linearGradient></defs><rect x=".5" y=".5" width="839" height="451" rx="20" fill="#161b22" stroke="#30363d"/><text x="44" y="58" font-size="12" font-weight="600" fill="#2997ff" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">FEATURED PROJECT</text><text x="796" y="58" font-size="14" font-weight="500" fill="#8b949e" text-anchor="end" class="a" style="animation-delay:0.05s">Jun – Jul 2026</text><text x="44" y="98" font-size="30" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.10s" letter-spacing="-0.5">Jersey City Last-Mile Mobility</text><text x="44" y="126" font-size="17" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.16s">A CitiBike demand and rebalancing analysis</text><text x="44" y="170" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.22s">Which stations run out of bikes, and when?</text><text x="44" y="192" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.26s">Cleaned 95,350 trips in pandas, modeled</text><text x="44" y="214" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.30s">station flow and imbalance in PostgreSQL,</text><text x="44" y="236" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.34s">and mapped all 108 stations in Tableau</text><text x="44" y="258" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.38s">with two city-separated rebalancing routes.</text><g class="a" style="animation-delay:0.40s"><rect x="44" y="284" width="95" height="28" rx="14.0" fill="#21262d"/><text x="91.4" y="299.5" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle">PostgreSQL</text></g><g class="a" style="animation-delay:0.46s"><rect x="146.8" y="284" width="66" height="28" rx="14.0" fill="#21262d"/><text x="179.6" y="299.5" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle">pandas</text></g><g class="a" style="animation-delay:0.52s"><rect x="220.48000000000002" y="284" width="73" height="28" rx="14.0" fill="#21262d"/><text x="257.0" y="299.5" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle">Tableau</text></g><g class="a" style="animation-delay:0.50s"><text x="44" y="350" font-size="28" font-weight="700" fill="url(#ng)" letter-spacing="-0.6">94,689</text><text x="44" y="370" font-size="13" fill="#8b949e">verified trips</text></g><g class="a" style="animation-delay:0.58s"><text x="176" y="350" font-size="28" font-weight="700" fill="url(#ng)" letter-spacing="-0.6">10</text><text x="176" y="370" font-size="13" fill="#8b949e">priority stations</text></g><g class="a" style="animation-delay:0.66s"><text x="308" y="350" font-size="28" font-weight="700" fill="url(#ng)" letter-spacing="-0.6">17.8%</text><text x="308" y="370" font-size="13" fill="#8b949e">peak daily imbalance</text></g><rect x="456" y="150" width="340" height="216" rx="16" fill="#21262d" class="a" style="animation-delay:.3s"/><text x="478" y="184" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.35s">Average ride length</text><text x="478" y="203" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.38s">Members commute; casual riders linger.</text><text x="478" y="230" font-size="13" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.45s">Member</text><rect x="478" y="238" width="117" height="22" rx="6" fill="#0090f7" class="gx" style="animation-delay:0.60s"/><text x="603.3333333333334" y="255" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:1.20s">8 min</text><text x="478" y="280" font-size="13" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.45s">Casual</text><rect x="478" y="288" width="220" height="22" rx="6" fill="#a94ef5" class="gx" style="animation-delay:0.75s"/><text x="706.0" y="305" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:1.35s">15 min</text><line x1="478" x2="774" y1="326" y2="326" stroke="#30363d"/><text x="478" y="350" font-size="13" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.60s">Busiest station</text><text x="774" y="350" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="end" class="a" style="animation-delay:0.60s">Grove St PATH</text><g class="a" style="animation-delay:.75s"><rect x="44" y="396" width="752" height="36" rx="10" fill="#0f2a4d"/><circle cx="64" cy="414" r="8" fill="#2997ff"/><path d="M60 414.2 l2.8 2.8 l5-5.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="418.5" font-size="13" fill="#f0f6fc">Independent AI code review caught a NULL bug and a sign error in 44 of 81 stations, both fixed before publishing.</text></g></svg>
