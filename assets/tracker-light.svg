<svg xmlns="http://www.w3.org/2000/svg" width="840" height="342" viewBox="0 0 840 342" role="img" aria-label="Side project, 100% vibe coded: Apple Music Release Tracker. Polls the iTunes API every 6 hours for 53 artists and sends a push and an email on new releases. 4,808 releases logged, no pip dependencies."><title>Side project, 100% vibe coded: Apple Music Release Tracker. Polls the iTunes API every 6 hours for 53 artists and sends a push and an email on new releases. 4,808 releases logged, no pip dependencies.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fa2d48"/><stop offset="1" stop-color="#a94ef5"/></linearGradient></defs><rect x=".5" y=".5" width="839" height="341" rx="20" fill="#f5f5f7"/><text x="44.0" y="56.0" font-size="12" font-weight="600" fill="#0071e3" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">SIDE PROJECT</text><g class="a" style="animation-delay:0.10s"><rect x="656" y="40" width="140" height="24" rx="12" fill="url(#vg)"/><text x="726" y="52" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.6" dominant-baseline="central">100% VIBE CODED</text></g><text x="44.0" y="98.0" font-size="28" font-weight="700" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.12s" letter-spacing="-0.47">Apple Music Release Tracker</text><text x="44.0" y="132.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.20s">Apple Music&#x27;s new-release alerts kept missing</text><text x="44.0" y="154.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.24s">drops, so this polls the iTunes API every 6</text><text x="44.0" y="176.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.28s">hours and sends a phone push and an email the</text><text x="44.0" y="198.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.32s">moment a release goes live.</text><text x="44.0" y="222.0" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.30s" font-style="italic">Built entirely by prompting AI: I directed and</text><text x="44.0" y="242.0" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.34s" font-style="italic">tested it.</text><text x="44.0" y="290.0" font-size="26" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.40s" letter-spacing="-0.6"><tspan fill="#0090f7">5</tspan><tspan fill="#3d78fc">3</tspan></text><text x="44.0" y="311.0" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.40s">artists watched</text><text x="182.7" y="290.0" font-size="26" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.48s" letter-spacing="-0.6"><tspan fill="#3d78fc">4</tspan><tspan fill="#4d72fe">,</tspan><tspan fill="#5c6cff">8</tspan><tspan fill="#6967fd">0</tspan><tspan fill="#7662fc">8</tspan></text><text x="182.7" y="311.0" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.48s">releases logged</text><text x="321.3" y="290.0" font-size="26" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.56s" letter-spacing="-0.6"><tspan fill="#7662fc">0</tspan></text><text x="321.3" y="311.0" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.56s">pip dependencies</text><g class="a" style="animation-delay:0.70s"><rect x="500" y="107.0" width="296" height="68" rx="16" fill="#ffffff" stroke="#d2d2d7"/><rect x="514" y="123.0" width="36" height="36" rx="9" fill="url(#vg)"/><path d="M528 148.0 V132.0 L538 130.0 V146.0" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="525.5" cy="148.0" r="2.8" fill="#fff"/><circle cx="535.5" cy="146.0" r="2.8" fill="#fff"/><text x="562" y="136.0" font-size="13" font-weight="600" fill="#1d1d1f">New release</text><text x="782" y="136.0" font-size="11" fill="#6e6e73" text-anchor="end">ntfy · now</text><text x="562" y="156.0" font-size="12" fill="#6e6e73">New music from your list</text></g><g class="a" style="animation-delay:1.05s"><rect x="500" y="191.0" width="296" height="68" rx="16" fill="#ffffff" stroke="#d2d2d7"/><rect x="514" y="207.0" width="36" height="36" rx="9" fill="url(#vg)"/><path d="M528 232.0 V216.0 L538 214.0 V230.0" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="525.5" cy="232.0" r="2.8" fill="#fff"/><circle cx="535.5" cy="230.0" r="2.8" fill="#fff"/><text x="562" y="220.0" font-size="13" font-weight="600" fill="#1d1d1f">Release alert</text><text x="782" y="220.0" font-size="11" fill="#6e6e73" text-anchor="end">Gmail · now</text><text x="562" y="240.0" font-size="12" fill="#6e6e73">Out now on Apple Music</text></g></svg>
