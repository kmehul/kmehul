<svg xmlns="http://www.w3.org/2000/svg" width="840" height="421" viewBox="0 0 840 421" role="img" aria-label="IMDB Movie Data Analysis: about 1 million source records from 17 sources loaded with Talend into a 12-table dimensional warehouse of about 8.9 million rows on Azure SQL."><title>IMDB Movie Data Analysis: about 1 million source records from 17 sources loaded with Talend into a 12-table dimensional warehouse of about 8.9 million rows on Azure SQL.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="840" y2="0"><stop offset="0" stop-color="#0090f7"/><stop offset=".5" stop-color="#5c6cff"/><stop offset="1" stop-color="#a94ef5"/></linearGradient></defs><rect x=".5" y=".5" width="839" height="420" rx="20" fill="#161b22" stroke="#30363d"/><text x="44.0" y="56.0" font-size="12" font-weight="600" fill="#2997ff" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">DEC 2023 – APR 2024</text><text x="44.0" y="96.0" font-size="28" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.10s" letter-spacing="-0.47">IMDB Movie Data Analysis</text><text x="44.0" y="140.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.20s">Loaded ~1M records from 17</text><text x="44.0" y="162.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.24s">heterogeneous sources (SQL tables,</text><text x="44.0" y="184.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.28s">JSON and TSV files) with Talend into a</text><text x="44.0" y="206.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.32s">12-table dimensional warehouse on</text><text x="44.0" y="228.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.36s">Azure SQL, then built Tableau</text><text x="44.0" y="250.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.40s">dashboards on ratings, revenue, genres</text><text x="44.0" y="272.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.44s">and release seasons.</text><rect x="424" y="122.0" width="372" height="164" rx="14" fill="#21262d" class="a" style="animation-delay:0.15s"/><pa