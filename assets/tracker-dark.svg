<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="Side project, 100% vibe coded: Apple Music Release Tracker. Polls the iTunes API every 6 hours for 53 artists and sends a push and an email on new releases. 4,808 releases logged, no pip dependencies."><title>Side project, 100% vibe coded: Apple Music Release Tracker. Polls the iTunes API every 6 hours for 53 artists and sends a push and an email on new releases. 4,808 releases logged, no pip dependencies.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.a{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
.f{opacity:0;animation:fade .35s ease forwards}
.gy{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:gy .9s cubic-bezier(.2,.8,.2,1) forwards}
.gx{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:gx 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.d{animation:draw 1.4s ease forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes gy{to{transform:scaleY(1)}}
@keyframes gx{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){
 .a,.f,.gy,.gx,.d,.cur,.tg{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
 .tm,.tc{display:none}
}
</style><linearGradient id="ng" gradientUnits="userSpaceOnUse" x1="44" y1="0" x2="420" y2="0"><stop offset="0" stop-color="#0090f7"/><stop offset=".5" stop-color="#5c6cff"/><stop offset="1" stop-color="#a94ef5"/></linearGradient><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fa2d48"/><stop offset="1" stop-color="#a94ef5"/></linearGradient></defs><rect x=".5" y=".5" width="839" height="299" rx="20" fill="#161b22" stroke="#30363d"/><text x="44" y="56" font-size="12" font-weight="600" fill="#2997ff" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">SIDE PROJECT</text><g class="a" style="animation-delay:.1s"><rect x="664" y="38" width="132" height="24" rx="12" fill="url(#vg)"/><text x="730" y="54.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">100% VIBE CODED</text></g><text x="44" y="98" font-size="28" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.12s" letter-spacing="-0.5">Apple Music Release Tracker</text><text x="44" y="132" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.20s">Apple Music&#x27;s new-release alerts kept missing drops, so</text><text x="44" y="154" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.24s">this polls the iTunes API every 6 hours and sends a phone</text><text x="44" y="176" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.28s">push and an email the moment a release goes live.</text><text x="44" y="198" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.32s" font-style="italic">Built entirely by prompting AI: I directed and tested it.</text><g class="a" style="animation-delay:0.40s"><text x="44" y="256" font-size="28" font-weight="700" fill="url(#ng)" letter-spacing="-0.6">53</text><text x="44" y="276" font-size="13" fill="#8b949e">artists watched</text></g><g class="a" style="animation-delay:0.48s"><text x="176" y="256" font-size="28" font-weight="700" fill="url(#ng)" letter-spacing="-0.6">4,808</text><text x="176" y="276" font-size="13" fill="#8b949e">releases logged</text></g><g class="a" style="animation-delay:0.56s"><text x="308" y="256" font-size="28" font-weight="700" fill="url(#ng)" letter-spacing="-0.6">0</text><text x="308" y="276" font-size="13" fill="#8b949e">pip dependencies</text></g><g class="a" style="animation-delay:0.70s"><rect x="512" y="108" width="284" height="68" rx="16" fill="#21262d" stroke="#30363d"/><rect x="526" y="124" width="36" height="36" rx="9" fill="url(#vg)"/><path d="M540 149 V133 L550 131 V147" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="537.5" cy="149" r="2.8" fill="#fff"/><circle cx="547.5" cy="147" r="2.8" fill="#fff"/><text x="574" y="137" font-size="13" font-weight="600" fill="#f0f6fc">New release</text><text x="782" y="137" font-size="11" fill="#8b949e" text-anchor="end">ntfy · now</text><text x="574" y="157" font-size="12" fill="#8b949e">An artist on your list dropped a single</text></g><g class="a" style="animation-delay:1.05s"><rect x="512" y="192" width="284" height="68" rx="16" fill="#21262d" stroke="#30363d"/><rect x="526" y="208" width="36" height="36" rx="9" fill="url(#vg)"/><path d="M540 233 V217 L550 215 V231" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="537.5" cy="233" r="2.8" fill="#fff"/><circle cx="547.5" cy="231" r="2.8" fill="#fff"/><text x="574" y="221" font-size="13" font-weight="600" fill="#f0f6fc">New release alert</text><text x="782" y="221" font-size="11" fill="#8b949e" text-anchor="end">Gmail · now</text><text x="574" y="241" font-size="12" fill="#8b949e">1 new release is out on Apple Music</text></g></svg>
