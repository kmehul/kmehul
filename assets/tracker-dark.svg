<svg xmlns="http://www.w3.org/2000/svg" width="840" height="542" viewBox="0 0 840 542" role="img" aria-label="Side project, 100% vibe coded: Apple Music Release Tracker. Checks the iTunes API every 6 hours for 53 artists and emails new releases. Over 4,800 releases logged, no external packages."><title>Side project, 100% vibe coded: Apple Music Release Tracker. Checks the iTunes API every 6 hours for 53 artists and emails new releases. Over 4,800 releases logged, no external packages.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fa2d48"/><stop offset="1" stop-color="#a94ef5"/></linearGradient></defs><rect x=".5" y=".5" width="839" height="541" rx="20" fill="#161b22" stroke="#30363d"/><text x="44.0" y="50.0" font-size="12" font-weight="600" fill="#2997ff" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">SIDE PROJECT</text><g class="a" style="animation-delay:0.10s"><rect x="656" y="34" width="140" height="24" rx="12" fill="url(#vg)"/><text x="726" y="46" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.6" dominant-baseline="central">100% VIBE CODED</text></g><text x="44.0" y="92.0" font-size="28" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.10s" letter-spacing="-0.47">Apple Music Release Tracker</text><text x="44.0" y="120.0" font-size="16" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.15s">A self-hosted new-release notifier</text><text x="44.0" y="156.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.20s">Apple Music&#x27;s new-release alerts kept missing</text><text x="44.0" y="179.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.24s">drops, so this checks the iTunes API every 6</text><text x="44.0" y="202.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.28s">hours and emails me the moment a release goes</text><text x="44.0" y="225.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.32s">live, including drops from prolific artists</text><text x="44.0" y="248.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.36s">that Apple&#x27;s 200-result cap used to hide.</text><g class="a" s