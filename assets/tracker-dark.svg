ass="m" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">18:07</text></g><rect x="44" y="326.0" width="752" height="80" rx="16" fill="#21262d" class="a" style="animation-delay:0.45s"/><text x="60.0" y="364.0" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.50s" letter-spacing="-0.5"><tspan fill="#0090f7">5</tspan><tspan fill="#3d78fc">3</tspan></text><text x="60.0" y="386.0" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.50s">artists watched</text><line x1="294.7" x2="294.7" y1="342.0" y2="390.0" stroke="#30363d" class="f" style="animation-delay:0.45s"/><text x="310.7" y="364.0" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.56s" letter-spacing="-0.5"><tspan fill="#3d78fc">4</tspan><tspan fill="#4a73fd">,</tspan><tspan fill="#566efe">8</tspan><tspan fill="#616afe">0</tspan><tspan fill="#6b66fd">0</tspan><tspan fill="#7662fc">+</tspan></text><text x="310.7" y="386.0" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.56s">releases logged</text><line x1="545.3" x2="545.3" y1="342.0" y2="390.0" stroke="#30363d" class="f" style="animation-delay:0.45s"/><text x="561.3" y="364.0" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.62s" letter-spacing="-0.5"><tspan fill="#7662fc">0</tspan></text><text x="561.3" y="386.0" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.62s">external packages</text><g class="a" style="animation-delay:0.60s"><rect x="44" y="420.0" width="752" height="38" rx="12" fill="#0f2a4d"/><circle cx="64" cy="439.0" r="9" fill="#2997ff"/><path d="M64 434.0 Q65 438.0 69 439.0 Q65 440.0 64 444.0 Q63 440.0 59 439.0 Q63 438.0 64 434.0Z" fill="#fff"/><text x="84" y="443.5" font-size="13" fill="#f0f6fc">Built entirely by prompting AI: I directed and tested it.</text></g><g class="a" style="animation-delay:0.70s"><rect x="44.0" y="478.0" width="65" height="28" rx="14.0" fill="#21262d"/><text x="76.5" y="492.0" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Python</text></g><g class="a" style="animation-delay:0.75s"><rect x="116.9" y="478.0" width="122" height="28" rx="14.0" fill="#21262d"/><text x="178.0" y="492.0" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">GitHub Actions</text></g><g class="a" style="animation-delay:0.80s"><rect x="247.0" y="478.0" width="94" height="28" rx="14.0" fill="#21262d"/><text x="293.8" y="492.0" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">iTunes API</text></g><g class="a" style="animation-delay:0.85s"><rect x="348.5" y="478.0" width="94" height="28" rx="14.0" fill="#21262d"/><text x="395.2" y="492.0" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Gmail SMTP</text></g></svg>
