<svg xmlns="http://www.w3.org/2000/svg" width="840" height="494" viewBox="0 0 840 494" role="img" aria-label="IMDB Movie Data Analysis: about 1 million source records from 17 sources loaded with Talend into a 12-table dimensional warehouse of about 8.9 million rows on Azure SQL."><title>IMDB Movie Data Analysis: about 1 million source records from 17 sources loaded with Talend into a 12-table dimensional warehouse of about 8.9 million rows on Azure SQL.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0090f7"/><stop offset="1" stop-color="#a94ef5"/></linearGradient></defs><rect x=".5" y=".5" width="839" height="493" rx="20" fill="#f5f5f7"/><text x="44.0" y="50.0" font-size="12" font-weight="600" fill="#0071e3" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">PROJECT</text><text x="796.0" y="50.0" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="end" class="a" style="animation-delay:0.05s">Dec 2023 – Apr 2024</text><text x="44.0" y="92.0" font-size="28" font-weight="700" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.10s" letter-spacing="-0.47">IMDB Movie Data Analysis</text><text x="44.0" y="120.0" font-size="16" font-weight="500" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.15s">A 12-table dimensional warehouse for movie analytics</text><text x="44.0" y="156.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.20s">Loaded ~1M records from 17 heterogeneous</text><text x="44.0" y="179.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.24s">sources (SQL tables, JSON and TSV files) with</text><text x="44.0" y="202.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.28s">Talend into a dimensional warehouse on Azure</text><text x="44.0" y="225.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.32s">SQL, then built Tableau dashboards on ratings,</text><text x="44.0" y="248.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.36s">revenue, genres and release seasons.</text><rect x="456" y="138.0" width="340" height="168" rx="16" fill="#ffffff" class="a" style="animation-delay:0.30s"/><path d="M563.6 164.0 C567.6 164.0 567.6 22