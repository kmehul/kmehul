" y="262" font-size="13" fill="#8b949e">sorted into a 12-month pipeline</text></g><g class="a" style="animation-delay:0.60s"><rect x="556.0" y="206" width="240.0" height="70" rx="14" fill="#21262d"/><text x="574.0" y="240" font-size="26" font-weight="700" fill="url(#ng)" letter-spacing="-0.5">~80%</text><text x="574.0" y="262" font-size="13" fill="#8b949e">submission-ready before deadlines</text></g></svg>
