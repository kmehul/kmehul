le="animation-delay:0.70s"><rect x="22.0" y="418.0" width="129" height="28" rx="14.0" fill="#21262d"/><text x="86.6" y="432.0" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Data extraction</text></g><g class="a" style="animation-delay:0.75s"><rect x="159.2" y="418.0" width="108" height="28" rx="14.0" fill="#21262d"/><text x="213.2" y="432.0" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Data quality</text></g><g class="a" style="animation-delay:0.80s"><rect x="22.0" y="454.0" width="108" height="28" rx="14.0" fill="#21262d"/><text x="75.9" y="468.0" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Gap analysis</text></g><g class="a" style="animation-delay:0.85s"><rect x="137.8" y="454.0" width="108" height="28" rx="14.0" fill="#21262d"/><text x="191.7" y="468.0" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Segmentation</text></g></svg>
