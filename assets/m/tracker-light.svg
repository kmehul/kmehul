<svg xmlns="http://www.w3.org/2000/svg" width="360" height="757" viewBox="0 0 360 757" role="img" aria-label="Side project, 100% vibe coded: Apple Music Release Tracker. Polls the iTunes API every 6 hours for 53 artists and sends a push and an email on new releases. 4,808 releases logged, no external packages."><title>Side project, 100% vibe coded: Apple Music Release Tracker. Polls the iTunes API every 6 hours for 53 artists and sends a push and an email on new releases. 4,808 releases logged, no external packages.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fa2d48"/><stop offset="1" stop-color="#a94ef5"/></linearGradient></defs><rect x=".5" y=".5" width="359" height="756" rx="20" fill="#f5f5f7"/><text x="22.0" y="50.0" font-size="12" font-weight="600" fill="#0071e3" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">SIDE PROJECT</text><g class="a" style="animation-delay:0.10s"><rect x="198" y="34" width="140" height="24" rx="12" fill="url(#vg)"/><text x="268" y="46" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.6" dominant-baseline="central">100% VIBE CODED</text></g><text x="22.0" y="92.0" font-size="28" font-weight="700" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.10s" letter-spacing="-0.47">Apple Music Release</text><text x="22.0" y="125.0" font-size="28" font-weight="700" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.14s" letter-spacing="-0.47">Tracker</text><text x="22.0" y="153.0" font-size="16" font-weight="500" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.15s">A self-hosted new-release notifier</text><text x="22.0" y="189.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.20s">Apple Music&#x27;s new-release alerts kept</text><text x="22.0" y="212.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.24s">missing drops, so this polls the</text><text x="22.0" y="235.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.28s">iTunes API every 6 hours and sends a</text><text x="22.0" y="258.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.32s">phone push and an email the moment a</text><text x="22.0" y="281.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.36s">release goes live.</text><g class="a" style="animation-delay:0.30s"><rect x="22" y="311.03999999999996" width="316" height="68" rx="16" fill="#ffffff" stroke="#d2d2d7"/><rect x="36" y="327.03999999999996" width="36" height="36" rx="9" fill="url(#vg)"/><path d="M50 352.03999999999996 V336.03999999999996 L60 334.03999999999996 V350.03999999999996" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="47.5" cy="352.03999999999996" r="2.8" fill="#fff"/><circle cx="57.5" cy="350.03999999999996" r="2.8" fill="#fff"/><text x="84" y="340.03999999999996" font-size="13" font-weight="600" fill="#1d1d1f">New release</text><text x="324" y="340.03999999999996" font-size="11" fill="#6e6e73" text-anchor="end">ntfy · now</text><text x="84" y="360.03999999999996" font-size="12" fill="#6e6e73">New music from your list</text></g><g class="a" style="animation-delay:0.60s"><rect x="22" y="391.03999999999996" width="316" height="68" rx="16" fill="#ffffff" stroke="#d2d2d7"/><rect x="36" y="407.03999999999996" width="36" height="36" rx="9" fill="url(#vg)"/><path d="M50 432.03999999999996 V416.03999999999996 L60 414.03999999999996 V430.03999999999996" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="47.5" cy="432.03999999999996" r="2.8" fill="#fff"/><circle cx="57.5" cy="430.03999999999996" r="2.8" fill="#fff"/><text x="84" y="420.03999999999996" font-size="13" font-weight="600" fill="#1d1d1f">Release alert</text><text x="324" y="420.03999999999996" font-size="11" fill="#6e6e73" text-anchor="end">Gmail · now</text><text x="84" y="440.03999999999996" font-size="12" fill="#6e6e73">Out now on Apple Music</text></g><rect x="22" y="483.03999999999996" width="316" height="96" rx="16" fill="#ffffff" class="a" style="animation-delay:0.45s"/><text x="38.0" y="521.0" font-size="21" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.50s" letter-spacing="-0.5"><tspan fill="#0090f7">5</tspan><tspan fill="#3d78fc">3</tspan></text><text x="38.0" y="543.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.50s">artists</text><text x="38.0" y="559.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.50s">watched</text><line x1="127.3" x2="127.3" y1="499.03999999999996" y2="563.04" stroke="#d2d2d7" class="f" style="animation-delay:0.45s"/><text x="143.3" y="521.0" font-size="21" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.56s" letter-spacing="-0.5"><tspan fill="#3d78fc">4</tspan><tspan fill="#4d72fe">,</tspan><tspan fill="#5c6cff">8</tspan><tspan fill="#6967fd">0</tspan><tspan fill="#7662fc">8</tspan></text><text x="143.3" y="543.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.56s">releases</text><text x="143.3" y="559.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.56s">logged</text><line x1="232.7" x2="232.7" y1="499.03999999999996" y2="563.04" stroke="#d2d2d7" class="f" style="animation-delay:0.45s"/><text x="248.7" y="521.0" font-size="21" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.62s" letter-spacing="-0.5"><tspan fill="#7662fc">0</tspan></text><text x="248.7" y="543.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.62s">external</text><text x="248.7" y="559.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.62s">packages</text><g class="a" style="animation-delay:0.60s"><rect x="22" y="593.04" width="316" height="56" rx="12" fill="#e6f0fd"/><circle cx="42" cy="612.04" r="9" fill="#0071e3"/><path d="M42 607.04 Q43 611.04 47 612.04 Q43 613.04 42 617.04 Q41 613.04 37 612.04 Q41 611.04 42 607.04Z" fill="#fff"/><text x="62" y="616.54" font-size="13" fill="#1d1d1f">Built entirely by prompting AI: I</text><text x="62" y="634.54" font-size="13" fill="#1d1d1f">directed and tested it.</text></g><g class="a" style="animation-delay:0.70s"><rect x="22.0" y="669.04" width="65" height="28" rx="14.0" fill="#ffffff"/><text x="54.5" y="683.04" font-size="13" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">Python</text></g><g class="a" style="animation-delay:0.75s"><rect x="94.9" y="669.04" width="122" height="28" rx="14.0" fill="#ffffff"/><text x="156.0" y="683.04" font-size="13" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">GitHub Actions</text></g><g class="a" style="animation-delay:0.80s"><rect x="225.0" y="669.04" width="94" height="28" rx="14.0" fill="#ffffff"/><text x="271.8" y="683.04" font-size="13" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">iTunes API</text></g><g class="a" style="animation-delay:0.85s"><rect x="22.0" y="705.04" width="51" height="28" rx="14.0" fill="#ffffff"/><text x="47.3" y="719.04" font-size="13" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">ntfy</text></g></svg>
