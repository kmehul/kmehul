<svg xmlns="http://www.w3.org/2000/svg" width="360" height="819" viewBox="0 0 360 819" role="img" aria-label="Side project, 100% vibe coded: Apple Music Release Tracker. Checks the iTunes API every 6 hours for 53 artists and emails new releases. Over 4,800 releases logged, no external packages."><title>Side project, 100% vibe coded: Apple Music Release Tracker. Checks the iTunes API every 6 hours for 53 artists and emails new releases. Over 4,800 releases logged, no external packages.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fa2d48"/><stop offset="1" stop-color="#a94ef5"/></linearGradient></defs><rect x=".5" y=".5" width="359" height="818" rx="20" fill="#f5f5f7"/><text x="22.0" y="50.0" font-size="12" font-weight="600" fill="#0071e3" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">SIDE PROJECT</text><g class="a" style="animation-delay:0.10s"><rect x="198" y="34" width="140" height="24" rx="12" fill="url(#vg)"/><text x="268" y="46" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.6" dominant-baseline="central">100% VIBE CODED</text></g><text x="22.0" y="92.0" font-size="28" font-weight="700" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.10s" letter-spacing="-0.47">Apple Music Release</text><text x="22.0" y="125.0" font-size="28" font-weight="700" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.14s" letter-spacing="-0.47">Tracker</text><text x="22.0" y="153.0" font-size="16" font-weight="500" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.15s">A self-hosted new-release notifier</text><text x="22.0" y="189.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.20s">Apple Music&#x27;s new-release alerts kept</text><text x="22.0" y="212.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.24s">missing drops, so this checks the</text><text x="22.0" y="235.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.28s">iTunes API every 6 hours and emails me</text><text x="22.0" y="258.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.32s">the moment a release goes live,</text><text x="22.0" y="281.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.36s">including drops from prolific artists</text><text x="22.0" y="304.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.40s">that Apple&#x27;s 200-result cap used to</text><text x="22.0" y="327.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.44s">hide.</text><g class="a" style="animation-delay:0.30s"><rect x="22" y="357.03999999999996" width="316" height="68" rx="16" fill="#ffffff" stroke="#d2d2d7"/><rect x="36" y="373.03999999999996" width="36" height="36" rx="9" fill="url(#vg)"/><path d="M50 398.03999999999996 V382.03999999999996 L60 380.03999999999996 V396.03999999999996" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="47.5" cy="398.03999999999996" r="2.8" fill="#fff"/><circle cx="57.5" cy="396.03999999999996" r="2.8" fill="#fff"/><text x="84" y="386.03999999999996" font-size="13" font-weight="600" fill="#1d1d1f">New release</text><text x="324" y="386.03999999999996" font-size="11" fill="#6e6e73" text-anchor="end">Gmail · now</text><text x="84" y="406.03999999999996" font-size="12" fill="#6e6e73">Out now on Apple Music</text></g><rect x="22" y="437.03999999999996" width="316" height="84" rx="16" fill="#ffffff" class="a" style="animation-delay:0.50s"/><text x="38.0" y="463.0" font-size="12.5" font-weight="500" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.55s">Checks daily, IST</text><g class="a" style="animation-delay:0.60s"><rect x="38.0" y="477.03999999999996" width="65.0" height="28" rx="14" fill="#f5f5f7" stroke="#d2d2d7"/><text x="70.5" y="491.03999999999996" font-size="12.5" font-weight="600" class="m" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">00:17</text></g><g class="a" style="animation-delay:0.66s"><rect x="111.0" y="477.03999999999996" width="65.0" height="28" rx="14" fill="#f5f5f7" stroke="#d2d2d7"/><text x="143.5" y="491.039999