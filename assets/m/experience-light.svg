<svg xmlns="http://www.w3.org/2000/svg" width="360" height="566" viewBox="0 0 360 566" role="img" aria-label="Experience: Data Analyst at Rebecca Everlene Trust Company, Oct 2024 to May 2025. About 8,000 foundation records audited, about 6,300 sorted into a 12-month grant pipeline, about 80% submission-ready before deadlines."><title>Experience: Data Analyst at Rebecca Everlene Trust Company, Oct 2024 to May 2025. About 8,000 foundation records audited, about 6,300 sorted into a 12-month grant pipeline, about 80% submission-ready before deadlines.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><rect x=".5" y=".5" width="359" height="565" rx="20" fill="#f5f5f7"/><text x="20.0" y="42.0" font-size="12" font-weight="600" fill="#0071e3" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">EXPERIENCE</text><text x="20.0" y="62.0" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.05s">Oct 2024 – May 2025</text><text x="20.0" y="98.0" font-size="26" font-weight="700" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.10s" letter-spacing="-0.43">Data Analyst</text><text x="20.0" y="124.0" font-size="15" font-weight="500" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.15s">Rebecca Everlene Trust Company</text><text x="20.0" y="144.0" font-size="15" font-weight="500" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.17s">Chicago, USA (Remote)</text><text x="20.0" y="176.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.22s">Built a grants intelligence dataset</text><text x="20.0" y="198.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.26s">from IRS 990 filings and foundation</text><text x="20.0" y="220.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.30s">websites, then audited,</text><text x="20.0" y="242.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.34s">gap-analyzed and enriched it into</text><text x="20.0" y="264.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.38s">submission-ready grant packages for</text><text x="20.0" y="286.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.42s">the team.</text><rect x="20.0" y="308.0" width="320.0" height="67" rx="14" fill="#ffffff" class="a" style="animation-delay:0.40s"/><text x="38.0" y="344.0" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.40s" letter-spacing="-0.5"><tspan fill="#0090f7">~</tspan><tspan fill="#0c8bf8">8</tspan><tspan fill="#1986f9">,</tspan><tspan fill="#2582fa">0</tspan><tspan fill="#317dfb">0</tspan><tspan fill="#3d78fc">0</tspan></text><text x="38.0" y="366.0" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.40s">foundation records audited</text><rect x="20.0" y="385.0" width="320.0" height="84" rx="14" fill="#ffffff" class="a" style="animation-delay:0.50s"/><text x="38.0" y="421.0" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.50s" letter-spacing="-0.5"><tspan fill="#3d78fc">~</tspan><tspan fill="#4a73fd">6</tspan><tspan fill="#566efe">,</tspan><tspan fill="#616afe">3</tspan><tspan fill="#6b66fd">0</tspan><tspan fill="#7662fc">0</tspan></text><text x="38.0" y="443.0" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.50s">sorted into a 12-month grant</text><text x="38.0" y="460.0" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.50s">pipeline</text><rect x="20.0" y="479.0" width="320.0" height="67" rx="14" fill="#ffffff" class="a" style="animation-delay:0.60s"/><text x="38.0" y="515.0" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.60s" letter-spacing="-0.5"><tspan fill="#7662fc">~</tspan><tspan fill="#875bf9">8</tspan><tspan fill="#9855f7">0</tspan><tspan fill="#a94ef5">%</tspan></text><text x="38.0" y="537.0" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.60s">submission-ready before deadlines</text></svg>
