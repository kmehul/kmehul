<svg xmlns="http://www.w3.org/2000/svg" width="360" height="601" viewBox="0 0 360 601" role="img" aria-label="Side project, 100% vibe coded: Apple Music Release Tracker. Polls the iTunes API every 6 hours for 53 artists and sends a push and an email on new releases. 4,808 releases logged, no pip dependencies."><title>Side project, 100% vibe coded: Apple Music Release Tracker. Polls the iTunes API every 6 hours for 53 artists and sends a push and an email on new releases. 4,808 releases logged, no pip dependencies.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fa2d48"/><stop offset="1" stop-color="#a94ef5"/></linearGradient></defs><rect x=".5" y=".5" width="359" height="600" rx="20" fill="#161b22" stroke="#30363d"/><text x="20.0" y="42.0" font-size="12" font-weight="600" fill="#2997ff" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">SIDE PROJECT</text><g class="a" style="animation-delay:0.10s"><rect x="200" y="26" width="140" height="24" rx="12" fill="url(#vg)"/><text x="270" y="38" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.6" dominant-baseline="central">100% VIBE CODED</text></g><text x="20.0" y="92.0" font-size="26" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.12s" letter-spacing="-0.43">Apple Music Release</text><text x="20.0" y="122.7" font-size="26" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.16s" letter-spacing="-0.43">Tracker</text><text x="20.0" y="154.7" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.20s">Apple Music&#x27;s new-release alerts</text><text x="20.0" y="176.7" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.24s">kept missing drops, so this polls</text><text x="20.0" y="198.7" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.28s">the iTunes API every 6 hours and</text><text x="20.0" y="220.7" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.32s">sends a phone push and an email the</text><text x="20.0" y="242.7" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.36s">moment a release goes live.</text><text x="20.0" y="268.7" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.30s" font-style="italic">Built entirely by prompting AI: I</text><text x="20.0" y="288.7" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.34s" font-style="italic">directed and tested it.</text><text x="20.0" y="332.7" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.40s" letter-spacing="-0.5"><tspan fill="#0090f7">5</tspan><tspan fill="#3d78fc">3</tspan></text><text x="132.0" y="331.7" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.40s">artists watched</text><text x="20.0" y="370.7" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.48s" letter-spacing="-0.5"><tspan fill="#3d78fc">4</tspan><tspan fill="#4d72fe">,</tspan><tspan fill="#5c6cff">8</tspan><tspan fill="#6967fd">0</tspan><tspan fill="#7662fc">8</tspan></text><text x="132.0" y="369.7" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.48s">releases logged</text><text x="20.0" y="408.7" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.56s" letter-spacing="-0.5"><tspan fill="#7662fc">0</tspan></text><text x="132.0" y="407.7" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.56s">pip dependencies</text><g class="a" style="animation-delay:0.60s"><rect x="20" y="432.68" width="320" height="68" rx="16" fill="#21262d" stroke="#30363d"/><rect x="34" y="448.68" width="36" height="36" rx="9" fill="url(#vg)"/><path d="M48 473.68 V457.68 L58 455.68 V471.68" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="45.5" cy="473.68" r="2.8" fill="#fff"/><circle cx="55.5" cy="471.68" r="2.8" fill="#fff"/><text x="82" y="461.68" font-size="13" font-weight="600" fill="#f0f6fc">New release</text><text x="326" y="461.68" font-size="11" fill="#8b949e" text-anchor="end">ntfy · now</text><text x="82" y="481.68" font-size="12" fill="#8b949e">New music from your list</text></g><g class="a" style="animation-delay:0.90s"><rect x="20" y="512.6800000000001" width="320" height="68" rx="16" fill="#21262d" stroke="#30363d"/><rect x="34" y="528.6800000000001" width="36" height="36" rx="9" fill="url(#vg)"/><path d="M48 553.6800000000001 V537.6800000000001 L58 535.6800000000001 V551.6800000000001" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="45.5" cy="553.6800000000001" r="2.8" fill="#fff"/><circle cx="55.5" cy="551.6800000000001" r="2.8" fill="#fff"/><text x="82" y="541.6800000000001" font-size="13" font-weight="600" fill="#f0f6fc">Release alert</text><text x="326" y="541.6800000000001" font-size="11" fill="#8b949e" text-anchor="end">Gmail · now</text><text x="82" y="561.6800000000001" font-size="12" fill="#8b949e">Out now on Apple Music</text></g></svg>
