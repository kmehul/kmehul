<svg xmlns="http://www.w3.org/2000/svg" width="360" height="880" viewBox="0 0 360 880" role="img" aria-label="Featured project: Jersey City Last-Mile Mobility, a CitiBike analysis. 94,689 verified trips, 10 priority stations, 17.8% peak daily imbalance. Members average 8 minute rides, casual riders 15. Busiest station: Grove St PATH."><title>Featured project: Jersey City Last-Mile Mobility, a CitiBike analysis. 94,689 verified trips, 10 priority stations, 17.8% peak daily imbalance. Members average 8 minute rides, casual riders 15. Busiest station: Grove St PATH.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><rect x=".5" y=".5" width="359" height="879" rx="20" fill="#161b22" stroke="#30363d"/><text x="22.0" y="50.0" font-size="12" font-weight="600" fill="#2997ff" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">FEATURED PROJECT</text><text x="338.0" y="50.0" font-size="13" font-weight="500" fill="#8b949e" text-anchor="end" class="a" style="animation-delay:0.05s">Jun – Jul 2026</text><text x="22.0" y="92.0" font-size="28" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.10s" letter-spacing="-0.47">Jersey City</text><text x="22.0" y="125.0" font-size="28" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.14s" letter-spacing="-0.47">Last-Mile Mobility</text><text x="22.0" y="153.0" font-size="16" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.15s">A CitiBike demand and</text><text x="22.0" y="175.0" font-size="16" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.19s">rebalancing analysis</text><text x="22.0" y="211.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.20s">Which stations run out of bikes, and</text><text x="22.0" y="234.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.24s">when? Cleaned 95,350 trips in pandas,</text><text x="22.0" y="257.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.28s">modeled station flow and imbalance in</text><text x="22.0" y="280.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.32s">PostgreSQL, and mapped all 108</text><text x="22.0" y="303.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.36s">stations in Tableau with two</text><text x="22.0" y="326.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.40s">city-separated rebalancing routes.</text><rect x="22" y="356.03999999999996" width="316" height="226.0" rx="16" fill="#21262d" class="a" style="animation-delay:0.30s"/><text x="42.0" y="390.0" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.35s">Average ride length</text><text x="42.0" y="410.0" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.38s">Members commute; casual riders linger.</text><text x="42.0" y="446.0" font-size="13" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.45s">Member</text><rect x="42" y="454.03999999999996" width="113" height="22" rx="6" fill="#0090f7" class="gx" style="animation-delay:0.60s"/><text x="163.1" y="471.0" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:1.20s">8 min</text><text x="42.0" y="496.0" font-size="13" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.45s">Casual</text><rect x="42" y="504.03999999999996" width="212" height="22" rx="6" fill="#a94ef5" class="gx" style="animation-delay:0.75s"/><text x="262.0" y="521.0" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:1.35s">15 min</text><line x1="42" x2="318" y1="536.04" y2="536.04" stroke="#30363d"/><text x="42.0" y="562.0" font-size="13" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.60s">Busiest station</text><text x="318.0" y="562.0" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="end" class="a" style="animation-delay:0.60s">Grove St PATH</text><rect x="22" y="606.04" width="316" height="96" rx="16" fill="#21262d" class="a" style="animation-delay:0.45s"/><text x="38.0" y="644.0" font-size="21" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.50s" letter-spacing="-0.5"><tspan fill="#0090f7">9</tspan><tspan fill="#0c8bf8">4</tspan><tspan fill="#1986f9">,</tspan><tspan fill="#2582fa">6</tspan><tspan fill="#317dfb">8</tspan><tspan fill="#3d78fc">9</tspan></text><text x="38.0" y="666.0" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.50s">verified</text><text x="38.0" y="682.0" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.50s">trips</text><line x1="127.3" x2="127.3" y1="622.04" y2="686.04" stroke="#30363d" class="f" style="animation-delay:0.45s"/><text x="143.3" y="644.0" font-size="21" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.56s" letter-spacing="-0.5"><tspan fill="#3d78fc">1</tspan><tspan fill="#7662fc">0</tspan></text><text x="143.3" y="666.0" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.56s">priority</text><text x="143.3" y="682.0" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.56s">stations</text><line x1="232.7" x2="232.7" y1="622.04" y2="686.04" stroke="#30363d" class="f" style="animation-delay:0.45s"/><text x="248.7" y="644.0" font-size="21" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.62s" letter-spacing="-0.5"><tspan fill="#7662fc">1</tspan><tspan fill="#825dfa">7</tspan><tspan fill="#8f58f8">.</tspan><tspan fill="#9c53f7">8</tspan><tspan fill="#a94ef5">%</tspan></text><text x="248.7" y="666.0" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.62s">peak daily</text><text x="248.7" y="682.0" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.62s">imbalance</text><g class="a" style="animation-delay:0.60s"><rect x="22" y="716.04" width="316" height="92" rx="12" fill="#0f2a4d"/><circle cx="42" cy="735.04" r="9" fill="#2997ff"/><path d="M38 735.24 l2.8 2.8 l5-5.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="739.54" font-size="13" fill="#f0f6fc">Independent AI code review caught</text><text x="62" y="757.54" font-size="13" fill="#f0f6fc">a NULL bug and a sign error in 44 of</text><text x="62" y="775.54" font-size="13" fill="#f0f6fc">81 stations, both fixed</text><text x="62" y="793.54" font-size="13" fill="#f0f6fc">before publishing.</text></g><g class="a" style="animation-delay:0.70s"><rect x="22.0" y="828.04" width="94" height="28" rx="14.0" fill="#21262d"/><text x="68.8" y="842.04" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">PostgreSQL</text></g><g class="a" style="animation-delay:0.75s"><rect x="123.5" y="828.04" width="129" height="28" rx="14.0" fill="#21262d"/><text x="188.1" y="842.04" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Python (pandas)</text></g><g class="a" style="animation-delay:0.80s"><rect x="260.8" y="828.04" width="72" height="28" rx="14.0" fill="#21262d"/><text x="296.8" y="842.04" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Tableau</text></g></svg>
