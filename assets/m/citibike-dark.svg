<svg xmlns="http://www.w3.org/2000/svg" width="360" height="893" viewBox="0 0 360 893" role="img" aria-label="Featured project: Jersey City Last-Mile Mobility, a CitiBike analysis. 94,689 verified trips, 10 priority stations, 17.8% peak daily imbalance. Members average 8 minute rides, casual riders 15. Busiest station: Grove St PATH."><title>Featured project: Jersey City Last-Mile Mobility, a CitiBike analysis. 94,689 verified trips, 10 priority stations, 17.8% peak daily imbalance. Members average 8 minute rides, casual riders 15. Busiest station: Grove St PATH.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><rect x=".5" y=".5" width="359" height="892" rx="20" fill="#161b22" stroke="#30363d"/><text x="20.0" y="42.0" font-size="12" font-weight="600" fill="#2997ff" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">FEATURED PROJECT</text><text x="20.0" y="62.0" font-size="13" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.05s">Jun – Jul 2026</text><text x="20.0" y="98.0" font-size="26" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.10s" letter-spacing="-0.43">Jersey City</text><text x="20.0" y="128.7" font-size="26" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.14s" letter-spacing="-0.43">Last-Mile Mobility</text><text x="20.0" y="154.7" font-size="15" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.16s">A CitiBike demand and rebalancing</text><text x="20.0" y="174.7" font-size="15" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.20s">analysis</text><text x="20.0" y="206.7" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.22s">Which stations run out of bikes,</text><text x="20.0" y="228.7" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.26s">and when? Cleaned 95,350 trips in</text><text x="20.0" y="250.7" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.30s">pandas, modeled station flow and</text><text x="20.0" y="272.7" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.34s">imbalance in PostgreSQL, and mapped</text><text x="20.0" y="294.7" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.38s">all 108 stations in Tableau with</text><text x="20.0" y="316.7" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.42s">two city-separated rebalancing</text><text x="20.0" y="338.7" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.46s">routes.</text><g class="a" style="animation-delay:0.35s"><rect x="20.0" y="356.68" width="100" height="28" rx="14.0" fill="#21262d"/><text x="70.0" y="370.68" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">PostgreSQL</text></g><g class="a" style="animation-delay:0.40s"><rect x="128.0" y="356.68" width="69" height="28" rx="14.0" fill="#21262d"/><text x="162.4" y="370.68" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">pandas</text></g><g class="a" style="animation-delay:0.45s"><rect x="204.8" y="356.68" width="77" height="28" rx="14.0" fill="#21262d"/><text x="243.1" y="370.68" font-size="13" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Tableau</text></g><text x="20.0" y="420.7" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.45s" letter-spacing="-0.5"><tspan fill="#0090f7">9</tspan><tspan fill="#0c8bf8">4</tspan><tspan fill="#1986f9">,</tspan><tspan fill="#2582fa">6</tspan><tspan fill="#317dfb">8</tspan><tspan fill="#3d78fc">9</tspan></text><text x="132.0" y="419.7" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.45s">verified trips</text><text x="20.0" y="458.7" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.53s" letter-spacing="-0.5"><tspan fill="#3d78fc">1</tspan><tspan fill="#7662fc">0</tspan></text><text x="132.0" y="457.7" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.53s">priority stations</text><text x="20.0" y="496.7" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.61s" letter-spacing="-0.5"><tspan fill="#7662fc">1</tspan><tspan fill="#825dfa">7</tspan><tspan fill="#8f58f8">.</tspan><tspan fill="#9c53f7">8</tspan><tspan fill="#a94ef5">%</tspan></text><text x="132.0" y="495.7" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.61s">peak daily imbalance</text><rect x="20" y="518.6800000000001" width="320" height="246.0" rx="16" fill="#21262d" class="a" style="animation-delay:0.50s"/><text x="40.0" y="552.7" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.55s">Average ride length</text><text x="40.0" y="572.7" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.58s">Members commute; casual riders</text><text x="40.0" y="588.7" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.62s">linger.</text><text x="40.0" y="626.7" font-size="13" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.65s">Member</text><rect x="40" y="634.6800000000001" width="115" height="22" rx="6" fill="#0090f7" class="gx" style="animation-delay:0.80s"/><text x="163.2" y="651.7" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:1.40s">8 min</text><text x="40.0" y="676.7" font-size="13" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.65s">Casual</text><rect x="40" y="684.6800000000001" width="216" height="22" rx="6" fill="#a94ef5" class="gx" style="animation-delay:0.95s"/><text x="264.0" y="701.7" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:1.55s">15 min</text><line x1="40" x2="320" y1="718.6800000000001" y2="718.6800000000001" stroke="#30363d"/><text x="40.0" y="744.7" font-size="13" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.80s">Busiest station</text><text x="320.0" y="744.7" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="end" class="a" style="animation-delay:0.80s">Grove St PATH</text><g class="a" style="animation-delay:0.70s"><rect x="20" y="780.6800000000001" width="320" height="92" rx="10" fill="#0f2a4d"/><circle cx="40" cy="799.6800000000001" r="8" fill="#2997ff"/><path d="M36 799.8800000000001 l2.8 2.8 l5-5.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="804.1800000000001" font-size="13" fill="#f0f6fc">Independent AI code review caught</text><text x="58" y="822.1800000000001" font-size="13" fill="#f0f6fc">a NULL bug and a sign error in 44</text><text x="58" y="840.1800000000001" font-size="13" fill="#f0f6fc">of 81 stations, both fixed before</text><text x="58" y="858.1800000000001" font-size="13" fill="#f0f6fc">publishing.</text></g></svg>
