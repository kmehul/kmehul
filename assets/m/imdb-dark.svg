<svg xmlns="http://www.w3.org/2000/svg" width="360" height="775" viewBox="0 0 360 775" role="img" aria-label="IMDB Movie Data Analysis: about 1 million source records from 17 sources loaded with Talend into a 12-table dimensional warehouse of about 8.9 million rows on Azure SQL."><title>IMDB Movie Data Analysis: about 1 million source records from 17 sources loaded with Talend into a 12-table dimensional warehouse of about 8.9 million rows on Azure SQL.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0090f7"/><stop offset="1" stop-color="#a94ef5"/></linearGradient></defs><rect x=".5" y=".5" width="359" height="774" rx="20" fill="#161b22" stroke="#30363d"/><text x="22.0" y="50.0" font-size="12" font-weight="600" fill="#2997ff" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">PROJECT</text><text x="338.0" y="50.0" font-size="13" font-weight="500" fill="#8b949e" text-anchor="end" class="a" style="animation-delay:0.05s">Dec 2023 – Apr 2024</text><text x="22.0" y="92.0" font-size="28" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.10s" letter-spacing="-0.47">IMDB Movie Data</text><text x="22.0" y="125.0" font-size="28" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.14s" letter-spacing="-0.47">Analysis</text><text x="22.0" y="153.0" font-size="16" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.15s">A 12-table dimensional warehouse</text><text x="22.0" y="175.0" font-size="16" font-weight="500" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.19s">for movie analytics</text><text x="22.0" y="211.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.20s">Loaded ~1M records from 17</text><text x="22.0" y="234.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.24s">heterogeneous sources (SQL tables,</text><text x="22.0" y="257.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.28s">JSON and TSV files) with Talend into a</text><text x="22.0" y="280.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.32s">dimensional warehouse on Azure SQL,</text><text x="22.0" y="303.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.36s">then built Tableau dashboards on</text><text x="22.0" y="326.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.40s">ratings, revenue, genres and release</text><text x="22.0" y="349.0" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.44s">seasons.</text><rect x="22" y="379.03999999999996" width="316" height="168" rx="16" fill="#21262d" class="a" style="animation-delay:0.30s"/><path d="M122.0 405.0 C126.0 405.0 126.0 463.0 130.0 463.0" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="72" style="--l:72;animation-delay:0.70s;animation-duration:0.8s" class="d"/><path d="M122.0 463.0 C126.0 463.0 126.0 463.0 130.0 463.0" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="8" style="--l:8;animation-delay:0.76s;animation-duration:0.8s" class="d"/><path d="M122.0 521.0 C126.0 521.0 126.0 463.0 130.0 463.0" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="72" style="--l:72;animation-delay:0.82s;animation-duration:0.8s" class="d"/><path d="M238.0 405.0 C234.0 405.0 234.0 463.0 230.0 463.0" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="72" style="--l:72;animation-delay:0.88s;animation-duration:0.8s" class="d"/><path d="M238.0 463.0 C234.0 463.0 234.0 463.0 230.0 463.0" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="8" style="--l:8;animation-delay:0.94s;animation-duration:0.8s" class="d"/><path d="M238.0 521.0 C234.0 521.0 234.0 463.0 230.0 463.0" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="72" style="--l:72;animation-delay:1.00s;animation-duration:0.8s" class="d"/><g class="a" style="animation-delay:0.50s"><rect x="36.0" y="393.0" width="86.0" height="24" rx="7" fill="#161b22" stroke="#30363d"/><text x="79.0" y="405.0" dominant-baseline="central" font-size="8.5" class="m" fill="#8b949e" 