4" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.35s" letter-spacing="-0.40">IMDB Movie Data</text><text x="20.0" y="256.3" font-size="24" font-weight="700" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.39s" letter-spacing="-0.40">Analysis</text><text x="20.0" y="286.3" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.40s">Loaded ~1M records from 17</text><text x="20.0" y="308.3" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.44s">heterogeneous sources (SQL tables,</text><text x="20.0" y="330.3" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.48s">JSON and TSV files) with Talend</text><text x="20.0" y="352.3" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.52s">into a 12-table dimensional</text><text x="20.0" y="374.3" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.56s">warehouse on Azure SQL, then built</text><text x="20.0" y="396.3" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.60s">Tableau dashboards on ratings,</text><text x="20.0" y="418.3" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.64s">revenue, genres and release</text><text x="20.0" y="440.3" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start" class="a" style="animation-delay:0.68s">seasons.</text><text x="20.0" y="482.3" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.50s" letter-spacing="-0.5"><tspan fill="#0090f7">1</tspan><tspan fill="#3d78fc">2</tspan></text><text x="132.0" y="481.3" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.50s">warehouse tables</text><text x="20.0" y="520.3" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.58s" letter-spacing="-0.5"><tspan fill="#3d78fc">~</tspan><tspan fill="#4d72fe">8</tspan><tspan fill="#5c6cff">.</tspan><tspan fill="#6967fd">9</tspan><tspan fill="#7662fc">M</tspan></text><text x="132.0" y="519.3" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.58s">warehouse rows</text><text x="20.0" y="558.3" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.66s" letter-spacing="-0.5"><tspan fill="#7662fc">1</tspan><tspan fill="#a94ef5">7</tspan></text><text x="132.0" y="557.3" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" class="a" style="animation-delay:0.66s">source files</text><g class="a" style="animation-delay:0.60s"><rect x="20.0" y="580.3199999999999" width="94" height="27" rx="13.5" fill="#21262d"/><text x="67.0" y="593.8199999999999" font-size="12" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">E/R Studio</text></g><g class="a" style="animation-delay:0.65s"><rect x="122.0" y="580.3199999999999" width="65" height="27" rx="13.5" fill="#21262d"/><text x="154.6" y="593.8199999999999" font-size="12" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Talend</text></g><g class="a" style="animation-delay:0.70s"><rect x="195.2" y="580.3199999999999" width="72" height="27" rx="13.5" fill="#21262d"/><text x="231.4" y="593.8199999999999" font-size="12" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Alteryx</text></g><g class="a" style="animation-delay:0.75s"><rect x="20.0" y="615.3199999999999" width="87" height="27" rx="13.5" fill="#21262d"/><text x="63.4" y="628.8199999999999" font-size="12" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Azure SQL</text></g><g class="a" style="animation-delay:0.80s"><rect x="114.8" y="615.3199999999999" width="72" height="27" rx="13.5" fill="#21262d"/><text x="151.0" y="628.8199999999999" font-size="12" font-weight="500" fill="#f0f6fc" text-anchor="middle" dominant-baseline="central">Tableau</text></g></svg>
