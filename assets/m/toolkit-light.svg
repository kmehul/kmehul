orn</tspan></text></g><text x="20.0" y="198.0" font-size="13" font-weight="600" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.20s">Databases</text><g class="a" style="animation-delay:0.35s"><rect x="20.0" y="210" width="125.0" height="34" rx="17" fill="#ffffff"/><text x="82.5" y="227" font-size="13.5" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central"><tspan fill="#336791" font-size="15">●</tspan><tspan dx="7">PostgreSQL</tspan></text></g><g class="a" style="animation-delay:0.39s"><rect x="153.0" y="210" width="125.0" height="34" rx="17" fill="#ffffff"/><text x="215.5" y="227" font-size="13.5" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central"><tspan fill="#cc2927" font-size="15">●</tspan><tspan dx="7">SQL Server</tspan></text></g><g class="a" style="animation-delay:0.43s"><rect x="20.0" y="252" width="116.9" height="34" rx="17" fill="#ffffff"/><text x="78.4" y="269" font-size="13.5" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central"><tspan fill="#0078d4" font-size="15">●</tspan><tspan dx="7">Azure SQL</tspan></text></g><g class="a" style="animation-delay:0.47s"><rect x="144.9" y="252" width="84.5" height="34" rx="17" fill="#ffffff"/><text x="187.1" y="269" font-size="13.5" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central"><tspan fill="#00758f" font-size="15">●</tspan><tspan dx="7">MySQL</tspan></text></g><text x="20.0" y="320.0" font-size="13" font-weight="600" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.28s">BI &amp; visualization</text><g class="a" style="animation-delay:0.51s"><rect x="20.0" y="332" width="100.7" height="34" rx="17" fill="#ffffff"/><text x="70.3" y="349" font-size="13.5" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central"><tspan fill="#e97627" font-size="15">●</tspan><tspan dx="7">Tableau</tspan></text></g><g class="a" style="animation-delay:0.