<svg xmlns="http://www.w3.org/2000/svg" width="840" height="622" viewBox="0 0 840 622" role="img" aria-label="Featured project: Jersey City Last-Mile Mobility, a CitiBike analysis. 94,689 verified trips, 10 priority stations, 17.8% peak daily imbalance. Members average 8 minute rides, casual riders 15. Busiest station: Grove St PATH."><title>Featured project: Jersey City Last-Mile Mobility, a CitiBike analysis. 94,689 verified trips, 10 priority stations, 17.8% peak daily imbalance. Members average 8 minute rides, casual riders 15. Busiest station: Grove St PATH.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><rect x=".5" y=".5" width="839" height="621" rx="20" fill="#f5f5f7"/><text x="44.0" y="50.0" font-size="12" font-weight="600" fill="#0071e3" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">FEATURED PROJECT</text><text x="796.0" y="50.0" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="end" class="a" style="animation-delay:0.05s">Jun – Jul 2026</text><text x="44.0" y="92.0" font-size="28" font-weight="700" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.10s" letter-spacing="-0.47">Jersey City Last-Mile Mobility</text><text x="44.0" y="120.0" font-size="16" font-weight="500" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.15s">A CitiBike demand and rebalancing analysis</text><text x="44.0" y="156.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.20s">Which stations run out of bikes, and when?</text><text x="44.0" y="179.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.24s">Cleaned 95,350 trips in pandas, modeled</text><text x="44.0" y="202.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.28s">station flow and imbalance in PostgreSQL, and</text><text x="44.0" y="225.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.32s">mapped all 108 stations in Tableau with two</text><text x="44.0" y="248.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.36s">city-separated rebalancing routes.</text><rect x="456" y="138.0" width="340" height="226.0" rx="16" fill="#ffffff" class="a" style="animation-delay:0.30s"/><text x="476.0" y="172.0" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.35s">Average ride length</text><text x="476.0" y="192.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.38s">Members commute; casual riders linger.</text><text x="476.0" y="228.0" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.45s">Member</text><rect x="476" y="236.0" width="126" height="22" rx="6" fill="#0090f7" class="gx" style="animation-delay:0.60s"/><text x="609.9" y="253.0" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:1.20s">8 min</text><text x="476.0" y="278.0" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.45s">Casual</text><rect x="476" y="286.0" width="236" height="22" rx="6" fill="#a94ef5" class="gx" style="animation-delay:0.75s"/><text x="720.0" y="303.0" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:1.35s">15 min</text><line x1="476" x2="776" y1="318.0" y2="318.0" stroke="#d2d2d7"/><text x="476.0" y="344.0" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.60s">Busiest station</text><text x="776.0" y="344.0" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="end" class="a" style="animation-delay:0.60s">Grove St PATH</text><rect x="44" y="388.0" width="752" height="80" rx="16" fill="#ffffff" class="a" style="animation-delay:0.45s"/><text x="60.0" y="426.0" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.50s" letter-spacing="-0.5"><tspan fill="#0090f7">9</tspan><tspan fill="#0c8bf8">4</tspan><tspan fill="#1986f9">,</tspan><tspan fill="#2582fa">6</tspan><tspan fill="#317dfb">8</tspan><tspan fill="#3d78fc">9</tspan></text><text x="60.0" y="448.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.50s">verified trips</text><line x1="294.7" x2="294.7" y1="404.0" y2="452.0" stroke="#d2d2d7" class="f" style="animation-delay:0.45s"/><text x="310.7" y="426.0" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.56s" letter-spacing="-0.5"><tspan fill="#3d78fc">1</tspan><tspan fill="#7662fc">0</tspan></text><text x="310.7" y="448.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.56s">priority stations</text><line x1="545.3" x2="545.3" y1="404.0" y2="452.0" stroke="#d2d2d7" class="f" style="animation-delay:0.45s"/><text x="561.3" y="426.0" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.62s" letter-spacing="-0.5"><tspan fill="#7662fc">1</tspan><tspan fill="#825dfa">7</tspan><tspan fill="#8f58f8">.</tspan><tspan fill="#9c53f7">8</tspan><tspan fill="#a94ef5">%</tspan></text><text x="561.3" y="448.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.62s">peak daily imbalance</text><g class="a" style="animation-delay:0.60s"><rect x="44" y="482.0" width="752" height="56" rx="12" fill="#e6f0fd"/><circle cx="64" cy="501.0" r="9" fill="#0071e3"/><path d="M60 501.2 l2.8 2.8 l5-5.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="505.5" font-size="13" fill="#1d1d1f">Independent AI code review caught a NULL bug and a sign error in 44 of 81 stations, both fixed</text><text x="84" y="523.5" font-size="13" fill="#1d1d1f">before publishing.</text></g><g class="a" style="animation-delay:0.70s"><rect x="44.0" y="558.0" width="94" height="28" rx="14.0" fill="#ffffff"/><text x="90.8" y="572.0" font-size="13" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">PostgreSQL</text></g><g class="a" style="animation-delay:0.75s"><rect x="145.5" y="558.0" width="129" height="28" rx="14.0" fill="#ffffff"/><text x="210.1" y="572.0" font-size="13" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">Python (pandas)</text></g><g class="a" style="animation-delay:0.80s"><rect x="282.8" y="558.0" width="72" height="28" rx="14.0" fill="#ffffff"/><text x="318.8" y="572.0" font-size="13" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">Tableau</text></g></svg>
