<svg xmlns="http://www.w3.org/2000/svg" width="840" height="375" viewBox="0 0 840 375" role="img" aria-label="Experience: Data Analyst at Rebecca Everlene Trust Company, Oct 2024 to May 2025. About 8,000 records audited, about 6,300 foundations segmented into a 12-month grant pipeline, about 80% submission-ready ahead of deadlines."><title>Experience: Data Analyst at Rebecca Everlene Trust Company, Oct 2024 to May 2025. About 8,000 records audited, about 6,300 foundations segmented into a 12-month grant pipeline, about 80% submission-ready ahead of deadlines.</title><defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace}
.a{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .35s ease both}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s cubic-bezier(.2,.8,.2,1) both}
.gx{transform-box:fill-box;transform-origin:0 50%;animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both}
.d{animation:draw 1.4s ease both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:var(--l)}}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes cv{0%,99%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><rect x=".5" y=".5" width="839" height="374" rx="20" fill="#f5f5f7"/><text x="44.0" y="50.0" font-size="12" font-weight="600" fill="#0071e3" text-anchor="start" class="a" style="animation-delay:0.05s" letter-spacing="1.4">EXPERIENCE</text><text x="796.0" y="50.0" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="end" class="a" style="animation-delay:0.05s">Oct 2024 – May 2025</text><text x="44.0" y="92.0" font-size="28" font-weight="700" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.10s" letter-spacing="-0.47">Data Analyst</text><text x="44.0" y="120.0" font-size="16" font-weight="500" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.15s">Rebecca Everlene Trust Company · Chicago, USA (Remote)</text><text x="44.0" y="156.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.20s">Built a grants intelligence dataset from IRS 990 filings and foundation websites, then</text><text x="44.0" y="179.0" font-size="15" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.24s">audited, gap-analyzed and enriched it into submission-ready grant packages for the team.</text><rect x="44" y="211.0" width="752" height="80" rx="16" fill="#ffffff" class="a" style="animation-delay:0.45s"/><text x="60.0" y="249.0" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.50s" letter-spacing="-0.5"><tspan fill="#0090f7">~</tspan><tspan fill="#0c8bf8">8</tspan><tspan fill="#1986f9">,</tspan><tspan fill="#2582fa">0</tspan><tspan fill="#317dfb">0</tspan><tspan fill="#3d78fc">0</tspan></text><text x="60.0" y="271.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.50s">records audited</text><line x1="294.7" x2="294.7" y1="227.0" y2="275.0" stroke="#d2d2d7" class="f" style="animation-delay:0.45s"/><text x="310.7" y="249.0" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.56s" letter-spacing="-0.5"><tspan fill="#3d78fc">~</tspan><tspan fill="#4a73fd">6</tspan><tspan fill="#566efe">,</tspan><tspan fill="#616afe">3</tspan><tspan fill="#6b66fd">0</tspan><tspan fill="#7662fc">0</tspan></text><text x="310.7" y="271.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.56s">foundations segmented</text><line x1="545.3" x2="545.3" y1="227.0" y2="275.0" stroke="#d2d2d7" class="f" style="animation-delay:0.45s"/><text x="561.3" y="249.0" font-size="24" font-weight="700" xml:space="preserve" class="a" style="animation-delay:0.62s" letter-spacing="-0.5"><tspan fill="#7662fc">~</tspan><tspan fill="#875bf9">8</tspan><tspan fill="#9855f7">0</tspan><tspan fill="#a94ef5">%</tspan></text><text x="561.3" y="271.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="a" style="animation-delay:0.62s">packages ready early</text><g class="a" style="animation-delay:0.70s"><rect x="44.0" y="311.0" width="129" height="28" rx="14.0" fill="#ffffff"/><text x="108.6" y="325.0" font-size="13" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">Data extraction</text></g><g class="a" style="animation-delay:0.75s"><rect x="181.2" y="311.0" width="108" height="28" rx="14.0" fill="#ffffff"/><text x="235.2" y="325.0" font-size="13" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">Data quality</text></g><g class="a" style="animation-delay:0.80s"><rect x="297.1" y="311.0" width="108" height="28" rx="14.0" fill="#ffffff"/><text x="351.0" y="325.0" font-size="13" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">Gap analysis</text></g><g class="a" style="animation-delay:0.85s"><rect x="412.9" y="311.0" width="108" height="28" rx="14.0" fill="#ffffff"/><text x="466.8" y="325.0" font-size="13" font-weight="500" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">Segmentation</text></g></svg>
