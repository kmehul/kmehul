yle="animation-delay:0.18s"><rect x="141.0" y="104.0" width="128" height="24" rx="7" fill="url(#ng)"/><text x="205.0" y="120.0" font-size="10.5" class="m" font-weight="600" fill="#ffffff" text-anchor="middle">fct_insp_violation</text></g><text x="26" y="210" font-size="12" font-weight="600" fill="#0071e3" text-anchor="start" class="a" style="animation-delay:0.30s" letter-spacing="1.4">OCT – NOV 2023</text><text x="26" y="242" font-size="23" font-weight="700" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.35s" letter-spacing="-0.4">California Food Inspections</text><text x="26" y="272" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.40s">Sonoma County facility inspections, profiled</text><text x="26" y="293" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.44s">in Alteryx, loaded into Azure SQL with</text><text x="26" y="314" font-size="14" font-weight="400" fill="#1d1d1f" text-anchor="start" class="a" style="animation-delay:0.48s">Talend, and mapped by risk in Tableau.</text><g class="a" style="animation-delay:0.50s"><text x="26" y="368" font-size="24" font-weight="700" fill="url(#ng)" letter-spacing="-0.5">5</text><text x="26" y="386" font-size="12" fill="#6e6e73">table star schema</text></g><g class="a" style="animation-delay:0.58s"><text x="150" y="368" font-size="24" font-weight="700" fill="url(#ng)" letter-spacing="-0.5">2</text><text x="150" y="386" font-size="12" fill="#6e6e73">fact tables</text></g><g class="a" style="animation-delay:0.66s"><text x="274" y="368" font-size="24" font-weight="700" fill="url(#ng)" letter-spacing="-0.5">3</text><text x="274" y="386" font-size="12" fill="#6e6e73">dimensions</text></g><g class="a" style="animation-delay:0.60s"><rect x="26" y="408" width="89" height="27" rx="13.5" fill="#ffffff"/><text x="70.6" y="422.5" font-size="12" font-weight="500" fill="#1d1d1f" text-anchor="middle">E/R Studio</te